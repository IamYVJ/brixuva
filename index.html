<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="app-version" content="__VERSION__">
<title>Brixuva</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e0e10'/><circle cx='16' cy='13' r='4' fill='%23ff5a36'/><rect x='7' y='22' width='18' height='3' rx='1.5' fill='%23f4f1ea'/></svg>">
<link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
<main id="app">
  <header id="hud">
    <div class="stat"><span class="label">Level</span><span id="hLevel">1</span></div>
    <div class="stat center"><span class="label">Score</span><span id="hScore">0</span></div>
    <div class="stat right"><span class="label">Lives</span><span id="hLives">•••</span></div>
  </header>
  <div id="stage"><canvas id="c"></canvas>

    <section id="menu" class="screen show">
      <h1>Brixuva</h1>
      <p class="sub">Break every brick.</p>
      <button id="btnPlay" class="primary">Continue</button>
      <button id="btnLevels">Levels</button>
      <p class="meta">Best <b id="mBest">0</b> · Total <b id="mTotal">0</b></p>
    </section>

    <section id="levels" class="screen">
      <h2>Levels</h2>
      <div id="grid"></div>
      <button id="btnBack">Back</button>
    </section>

    <section id="overlay" class="screen">
      <h2 id="oTitle"></h2>
      <p class="big" id="oScore"></p>
      <p class="sub" id="oSub"></p>
      <button id="btnNext" class="primary"></button>
      <button id="btnMenu">Menu</button>
    </section>

    <div id="hint">Tap or press space to launch</div>
    <button id="btnPause" aria-label="Pause">II</button>
  </div>
  <footer id="ver">v<span id="vTxt">dev</span></footer>
</main>
<script src="game.js?v=__VERSION__"></script>
</body>
</html>
